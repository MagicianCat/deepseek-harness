# Restrictive SDK profile for the Skill platform. The run-scoped MCP token and
# the model credential are supplied only through the child process environment.
- id: llm-deepseek
  config:
    baseURL: !!js process.env.DEEPSEEK_BASE_URL ?? 'https://tkcopilot.taikang.com/v1/deepseek'
    apiKeyEnv: DEEPSEEK_API_KEY
    defaultContextWindow: 1000000
    reasoningEffort: !!js process.env.DSH_REASONING_EFFORT ?? 'high'
    maxTokens: !!js Number(process.env.DSH_MAX_TOKENS ?? 16384)
    retryPolicy:
      mode: normal
      maxRetries: 1

- id: persistent-bash
  disabled: true

- id: persistent-pwsh
  disabled: true

- id: str-replace-editor
  disabled: true

- insert:
    - id: skill-platform-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: skill_platform
        transport: streamable-http
        url: !!js process.env.SKILL_PLATFORM_MCP_URL
        headers:
          Authorization: !!js '`Bearer ${process.env.MCP_TOKEN}`'
        toolCallTimeoutMs: 60000
        # A run-scoped token can expire between the frontend request and the
        # child runtime startup. Keep the agent context alive so the MCP
        # client reports an unavailable tool and the runtime can recover or
        # return a useful answer instead of failing during plugin mounting.
        failOnStartupError: false
        reconnect:
          enabled: false
